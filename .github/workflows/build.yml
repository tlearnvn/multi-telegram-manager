name: Build

# Mỗi lần đẩy mã lên nhánh:
#   1. tự tăng số patch trong VERSION.txt (đúng yêu cầu "phiên bản tự bump khi update code"),
#   2. build bản Windows 64-bit và Debian/Linux 64-bit,
#   3. đóng gói bản portable (dữ liệu nằm cạnh tệp chạy) rồi tải lên artifacts.
#
# TDLib được build một lần rồi giữ trong cache; nếu bước đó lỗi thì gói vẫn ra,
# chỉ là người dùng phải tự đặt tdjson vào cạnh tệp chạy.

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Phần phiên bản cần tăng'
        type: choice
        options: [patch, minor, major, none]
        default: patch
      build_tdlib:
        description: 'Build kèm TDLib (chậm, ~40 phút mỗi nền tảng)'
        type: boolean
        default: true

# KHÔNG huỷ lần chạy đang dở: TDLib mất 45–55 phút để biên dịch. Huỷ giữa đường
# thì cache vĩnh viễn trống và mọi lần đẩy mã sau đó lại phải build lại từ đầu.
# Xếp hàng chờ thì lần chạy trước ghi được cache, lần sau chỉ mất vài phút.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: 6.4.3
  TDLIB_REF: master

jobs:
  # ---------------------------------------------------------------------------
  #  Tự tăng phiên bản
  # ---------------------------------------------------------------------------
  version:
    name: Tăng phiên bản
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tăng số phiên bản
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          part="${{ github.event.inputs.bump || 'patch' }}"

          before=$(python3 scripts/bump_version.py --print)

          if [ "$part" = "none" ]; then
            echo "Bỏ qua bước tăng phiên bản theo yêu cầu."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/bump_version.py --part "$part"
          else
            # Chỉ tăng khi lần đẩy này thực sự chạm vào mã nguồn. Script tự lùi
            # về HEAD~1 rồi về nội dung commit nếu mốc so sánh không dùng được
            # (nhánh mới thì github.event.before là toàn số 0).
            python3 scripts/bump_version.py --auto --part patch \
              --diff-base "${{ github.event.before }}"
          fi

          after=$(python3 scripts/bump_version.py --print)
          echo "version=$after" >> "$GITHUB_OUTPUT"
          echo "Phiên bản: $before -> $after"

          if [ "$before" != "$after" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION.txt
            git commit -m "chore(version): $after [skip ci]"
            for attempt in 1 2 3 4; do
              if git push origin "HEAD:${GITHUB_REF#refs/heads/}"; then
                break
              fi
              sleep $((2 ** attempt))
              git pull --rebase origin "${GITHUB_REF#refs/heads/}" || true
            done
          fi

  # ---------------------------------------------------------------------------
  #  Debian / Linux 64-bit
  # ---------------------------------------------------------------------------
  linux:
    name: Linux x86_64 (Debian 12+)
    needs: version
    # Ubuntu 22.04 dùng glibc 2.35 nên nhị phân chạy được trên Debian 12 (2.36)
    # trở lên và mọi bản Ubuntu từ 22.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài gói hệ thống
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build patchelf gperf libssl-dev zlib1g-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1

      - name: Cài Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          cache: true

      - name: Xác định commit TDLib
        id: tdlib_ref
        run: |
          sha=$(git ls-remote https://github.com/tdlib/td.git "${{ env.TDLIB_REF }}" | cut -f1)
          echo "sha=${sha:-unknown}" >> "$GITHUB_OUTPUT"
          echo "TDLib $sha"

      # Dùng restore + save rời nhau chứ không dùng actions/cache: bước "post" của
      # actions/cache chỉ ghi khi job THÀNH CÔNG, nên một lỗi biên dịch ở bước
      # sau sẽ xoá sạch gần một giờ build TDLib. Ghi cache ngay sau khi build
      # xong thì lần chạy kế tiếp luôn có sẵn, dù job này có đỏ hay không.
      - name: Lấy TDLib từ cache
        id: tdlib_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/tdlib-prefix
          key: tdlib-linux-${{ steps.tdlib_ref.outputs.sha }}-v1

      - name: Build TDLib (chỉ khi cache trống)
        id: tdlib_build
        if: steps.tdlib_cache.outputs.cache-hit != 'true' && github.event.inputs.build_tdlib != 'false'
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ env.TDLIB_REF }}" https://github.com/tdlib/td.git /tmp/td
          cmake -S /tmp/td -B /tmp/td/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/tdlib-prefix" \
            -DTD_ENABLE_LTO=OFF \
            -DTD_ENABLE_JNI=OFF
          cmake --build /tmp/td/build --target tdjson -j"$(nproc)"
          cmake --install /tmp/td/build --component tdjson || true
          # Bản build ra libtdjson.so nằm trong thư mục build; copy thủ công cho chắc.
          mkdir -p "$HOME/tdlib-prefix/lib"
          find /tmp/td/build -name 'libtdjson.so*' -exec cp -L {} "$HOME/tdlib-prefix/lib/" \;
          ls -la "$HOME/tdlib-prefix/lib" || true
          # Chỉ báo "xong" khi thư viện thật sự có mặt — bước ghi cache dựa vào đây.
          if compgen -G "$HOME/tdlib-prefix/lib/libtdjson.so*" > /dev/null; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ghi TDLib vào cache
        if: steps.tdlib_build.outputs.built == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/tdlib-prefix
          key: tdlib-linux-${{ steps.tdlib_ref.outputs.sha }}-v1

      - name: Build ứng dụng
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION_OVERRIDE="${{ needs.version.outputs.version }}" \
            -DBUILD_TESTS=ON -DBUILD_UI_PREVIEW=ON
          cmake --build build -j"$(nproc)"

      - name: Chạy bộ kiểm tra tự động
        run: ./build/bin/tuan_selftest

      - name: Kiểm tra cầu nối TDLib
        run: |
          # Chỉ chạy được khi build TDLib thành công. Thử luôn với thư viện thật:
          # nạp tdjson, tạo client, đẩy tham số khởi tạo rồi chờ TDLib chuyển
          # sang bước nhập số điện thoại. Không cần tài khoản thật.
          if compgen -G "$HOME/tdlib-prefix/lib/libtdjson.so*" > /dev/null; then
            lib=$(ls "$HOME"/tdlib-prefix/lib/libtdjson.so* | head -1)
            TDJSON_PATH="$lib" ./build/bin/tuan_tdcheck
          else
            echo "Bỏ qua: chưa build được TDLib trong lần chạy này."
          fi

      - name: Dựng ảnh xem trước giao diện
        run: |
          # Vừa là kiểm tra khói cho toàn bộ giao diện (dựng đủ cửa sổ, mọi
          # panel, delegate) vừa cho ra ảnh để soi khi cần.
          mkdir -p artifacts/anh
          QT_QPA_PLATFORM=offscreen ./build/bin/tuan_uipreview artifacts/anh
          ls -la artifacts/anh

      - uses: actions/upload-artifact@v4
        with:
          name: anh-giao-dien-${{ needs.version.outputs.version }}
          path: artifacts/anh/*.png
          if-no-files-found: warn

      - name: Đóng gói bản cơ động
        run: |
          set -euo pipefail
          chmod +x packaging/linux/make-portable.sh
          OUT="dist/TuanMultiTeleClient-${{ needs.version.outputs.version }}-linux-x64"
          ./packaging/linux/make-portable.sh build/bin/TuanMultiTeleClient "$QT_ROOT_DIR" "$OUT"

          cp README.md LICENSE VERSION.txt "$OUT/"
          cp docs/HUONG-DAN.md "$OUT/" 2>/dev/null || true

          # Kèm TDLib nếu build được.
          if compgen -G "$HOME/tdlib-prefix/lib/libtdjson.so*" > /dev/null; then
            cp -L "$HOME"/tdlib-prefix/lib/libtdjson.so* "$OUT/lib/"
            # Bảo đảm có tệp mang đúng tên "libtdjson.so" để trình nạp tìm thấy.
            # TDLib có bản ra thẳng libtdjson.so, có bản ra libtdjson.so.1.8.x.
            if [ ! -e "$OUT/lib/libtdjson.so" ]; then
              versioned=$(cd "$OUT/lib" && ls libtdjson.so.* | head -1)
              ( cd "$OUT/lib" && ln -sf "$versioned" libtdjson.so )
            fi
            echo "Đã kèm TDLib vào gói."
          else
            echo "CHƯA có TDLib — người dùng cần tự đặt libtdjson.so vào thư mục lib/." \
              | tee "$OUT/THIEU-TDLIB.txt"
          fi

          tar -C dist -czf "dist/$(basename "$OUT").tar.gz" "$(basename "$OUT")"
          ls -la dist

      - name: Kiểm tra bản build chạy được
        run: |
          set -euo pipefail
          OUT="dist/TuanMultiTeleClient-${{ needs.version.outputs.version }}-linux-x64"
          cd "$OUT"
          QT_QPA_PLATFORM=offscreen ./TuanMultiTeleClient --version
          echo "--- kiểm tra khởi động ---"
          QT_QPA_PLATFORM=offscreen timeout 10 ./TuanMultiTeleClient || true
          test -d data && echo "OK: đã tạo thư mục data cạnh tệp chạy"
          cat data/logs/*.log | head -20

          # Có kèm thư viện thì phải nạp được. Đây là phép kiểm duy nhất bắt
          # được trường hợp tệp có mặt nhưng thiếu phụ thuộc nên nạp vẫn lỗi.
          if [ -e lib/libtdjson.so ]; then
            if ! grep -q "Đã nạp tdjson" data/logs/*.log; then
              cat data/logs/*.log
              echo "Có libtdjson.so trong gói nhưng ứng dụng không nạp được." >&2
              exit 1
            fi
            echo "OK: nạp được tdjson từ gói"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TuanMultiTeleClient-${{ needs.version.outputs.version }}-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  Windows 64-bit
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Xác định commit TDLib
        id: tdlib_ref
        shell: bash
        run: |
          sha=$(git ls-remote https://github.com/tdlib/td.git "${{ env.TDLIB_REF }}" | cut -f1)
          echo "sha=${sha:-unknown}" >> "$GITHUB_OUTPUT"

      # Xem ghi chú ở job Linux: ghi cache ngay sau khi build xong, đừng để bước
      # "post" của actions/cache bỏ qua vì job đỏ.
      - name: Lấy TDLib từ cache
        id: tdlib_cache
        uses: actions/cache/restore@v4
        with:
          path: C:\tdlib-prefix
          key: tdlib-windows-${{ steps.tdlib_ref.outputs.sha }}-v1

      - name: Build TDLib (chỉ khi cache trống)
        id: tdlib_build
        if: steps.tdlib_cache.outputs.cache-hit != 'true' && github.event.inputs.build_tdlib != 'false'
        continue-on-error: true
        shell: cmd
        run: |
          git clone --depth 1 --branch %TDLIB_REF% https://github.com/tdlib/td.git C:\td || exit /b 0
          "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" install gperf:x64-windows openssl:x64-windows zlib:x64-windows || exit /b 0
          cmake -S C:\td -B C:\td\build -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake ^
            -DTD_ENABLE_LTO=OFF || exit /b 0
          cmake --build C:\td\build --target tdjson --config Release || exit /b 0
          mkdir C:\tdlib-prefix\bin 2>nul
          for /r C:\td\build %%f in (tdjson.dll) do copy /y "%%f" C:\tdlib-prefix\bin\
          rem Gom luôn OpenSSL/zlib mà tdjson.dll cần vào cùng thư mục được cache.
          rem Nếu chỉ cache tdjson.dll thì lần chạy sau (cache trúng) sẽ bỏ qua
          rem bước cài vcpkg, và gói phát hành thiếu OpenSSL — nạp tdjson sẽ lỗi.
          copy /y "%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin\libcrypto*.dll" C:\tdlib-prefix\bin\ 2>nul
          copy /y "%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin\libssl*.dll" C:\tdlib-prefix\bin\ 2>nul
          copy /y "%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin\zlib*.dll" C:\tdlib-prefix\bin\ 2>nul
          dir C:\tdlib-prefix\bin
          rem Mọi lệnh trên đều "exit /b 0" khi lỗi để job vẫn đi tiếp, nên phải
          rem tự kiểm tra tệp mới biết là build được. Bước ghi cache dựa vào đây.
          if exist C:\tdlib-prefix\bin\tdjson.dll echo built=true>>%GITHUB_OUTPUT%

      - name: Ghi TDLib vào cache
        if: steps.tdlib_build.outputs.built == 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\tdlib-prefix
          key: tdlib-windows-${{ steps.tdlib_ref.outputs.sha }}-v1

      - name: Build ứng dụng
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 ^
            -DAPP_VERSION_OVERRIDE=${{ needs.version.outputs.version }} || exit /b 1
          cmake --build build --config Release --parallel || exit /b 1
          dir build\bin

      - name: Đóng gói bản cơ động
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.version.outputs.version }}'
          $out = "dist\TuanMultiTeleClient-$version-win-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item build\bin\TuanMultiTeleClient.exe $out
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
              --release --no-translations --no-system-d3d-compiler `
              --no-opengl-sw --no-compiler-runtime `
              "$out\TuanMultiTeleClient.exe"

          # Runtime MSVC phải nằm trong gói: máy chưa cài "Visual C++
          # Redistributable" sẽ báo thiếu vcruntime140.dll ngay khi mở — đúng vào
          # tình huống cắm USB sang máy khác mà bản cơ động này hướng tới.
          # Tự copy chứ không nhờ windeployqt --compiler-runtime, vì bước này
          # không nạp môi trường dòng lệnh của Visual Studio nên windeployqt có
          # thể không tìm ra thư mục redist (và im lặng không copy gì).
          $crt = Get-ChildItem `
              "${env:ProgramFiles}\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" `
              -Directory -ErrorAction SilentlyContinue |
              Sort-Object FullName | Select-Object -Last 1
          if ($crt) {
              Copy-Item "$($crt.FullName)\*.dll" $out -Force
              Write-Host "Da kem runtime MSVC tu $($crt.FullName)"
          } else {
              Write-Host 'Khong tim thay thu muc redist cua Visual Studio.'
          }

          # Không có các DLL này thì gói coi như hỏng với người dùng cuối, nên
          # thà báo đỏ ở đây còn hơn phát hành một bản không mở được.
          foreach ($dll in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
              if (-not (Test-Path "$out\$dll")) {
                  Get-ChildItem $out | Select-Object Name
                  throw "Thieu $dll trong goi — ban co dong se khong chay tren may chua cai VC++ Redistributable."
              }
          }

          Copy-Item README.md, LICENSE, VERSION.txt $out
          if (Test-Path docs\HUONG-DAN.md) { Copy-Item docs\HUONG-DAN.md $out }

          # Kèm TDLib nếu build được. Thư mục cache đã chứa cả OpenSSL/zlib mà
          # tdjson.dll cần, nên copy trọn gói — không phụ thuộc vào việc bước
          # cài vcpkg có chạy trong lần này hay không.
          if (Test-Path C:\tdlib-prefix\bin\tdjson.dll) {
              Copy-Item C:\tdlib-prefix\bin\*.dll $out -Force
              Write-Host 'Da kem TDLib vao goi:'
              Get-ChildItem "$out\*.dll" | Where-Object { $_.Name -match '^(tdjson|libcrypto|libssl|zlib)' } |
                  ForEach-Object { Write-Host "   $($_.Name)" }
              Write-Host 'Da kem TDLib vao goi.'
          } else {
              'Chua co TDLib - hay tai tdjson.dll va dat canh tep chay.' |
                  Out-File -Encoding utf8 "$out\THIEU-TDLIB.txt"
          }

          Compress-Archive -Path "$out\*" -DestinationPath "dist\TuanMultiTeleClient-$version-win-x64.zip" -Force
          Get-ChildItem dist

      - name: Kiểm tra bản build chạy được
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "dist\TuanMultiTeleClient-${{ needs.version.outputs.version }}-win-x64"

          # Không gọi --version ở đây: tệp chạy thuộc phân hệ GUI nên
          # QCommandLineParser có thể mở hộp thoại thay vì in ra console, làm CI
          # treo. Thay vào đó mở ứng dụng thật rồi soi kết quả trên đĩa.
          function Try-Start($platform) {
              if ($platform) { $env:QT_QPA_PLATFORM = $platform }
              else { Remove-Item Env:\QT_QPA_PLATFORM -ErrorAction SilentlyContinue }
              $p = Start-Process -FilePath "$out\TuanMultiTeleClient.exe" -PassThru
              Start-Sleep -Seconds 15
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
              return (Test-Path "$out\data")
          }

          # Thử phân hệ đồ hoạ thật trước; nếu runner không dựng được cửa sổ thì
          # thử lại bằng offscreen để phân biệt "lỗi ứng dụng" với "runner không
          # có màn hình".
          $ok = Try-Start $null
          if (-not $ok) {
              Write-Host 'Khong tao duoc data voi phan he mac dinh, thu offscreen...'
              $ok = Try-Start 'offscreen'
          }

          # Thư mục data phải nằm cạnh tệp chạy — đây là yêu cầu cơ động.
          if (-not $ok) {
              Get-ChildItem $out
              throw 'Ứng dụng không tạo được thư mục data cạnh tệp chạy.'
          }
          Write-Host 'OK: da tao thu muc data canh tep chay'

          $log = Get-ChildItem "$out\data\logs\*.log" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $log) { throw 'Không có tệp log — ứng dụng chưa khởi động được.' }
          # Ứng dụng ghi log bằng UTF-8 (QTextStream của Qt 6), nên đọc đúng bảng
          # mã để so khớp chuỗi tiếng Việt cho chắc.
          $text = [System.IO.File]::ReadAllText($log.FullName, [System.Text.Encoding]::UTF8)
          Get-Content $log.FullName -TotalCount 20

          # Nếu gói có tdjson.dll thì ứng dụng phải nạp được nó. Đây là phép kiểm
          # duy nhất bắt được trường hợp thiếu DLL phụ thuộc (OpenSSL/zlib):
          # tdjson.dll có mặt nhưng LoadLibrary vẫn thất bại.
          if (Test-Path "$out\tdjson.dll") {
              if (($text -match 'Cannot load library') -or ($text -notmatch 'Đã nạp tdjson')) {
                  Write-Host '--- toan bo log ---'
                  Write-Host $text
                  throw 'Co tdjson.dll trong goi nhung ung dung khong nap duoc — thieu DLL phu thuoc.'
              }
              Write-Host 'OK: nap duoc tdjson tu goi'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: TuanMultiTeleClient-${{ needs.version.outputs.version }}-win-x64
          path: dist/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  Phát hành (chỉ khi bấm "Run workflow" thủ công)
  # ---------------------------------------------------------------------------
  release:
    name: Phát hành bản tải về
    needs: [version, linux, windows]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Gom tệp cài đặt
        run: |
          mkdir -p release
          find downloaded -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} release/ \;
          ls -la release
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: "Tuấn' MultiTele Client v${{ needs.version.outputs.version }}"
